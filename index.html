document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olute;width:640px;height:640px;border-radius:50%;border:1.5px solid rgba(31,137,150,.12);right:-120px;top:-100px;pointer-events:none\"><\u002Fdiv>\n  <div aria-hidden=\"true\" style=\"position:absolute;width:640px;height:640px;border-radius:50%;border:1.5px solid rgba(31,137,150,.07);right:-40px;top:-20px;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n    <div id=\"mw-hero-copy\" style=\"min-width:0\">\n      <span style=\"display:inline-block;max-width:100%;font-size:12.5px;font-weight:700;letter-spacing:.01em;color:#1f8996;background:#e8f6f9;padding:9px 16px;border-radius:999px;line-height:1.2;border:1px solid rgba(31,137,150,.45);box-shadow:0 0 0 3px rgba(31,137,150,.10),0 0 18px rgba(31,137,150,.28)\">For International Medical Graduates planning the move to the UK.<\u002Fspan>\n      <h1 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.08;color:#0f2a30;font-size:clamp(30px,3.6vw,46px);margin:24px 0 0\">The easiest way to move to the UK, <span style=\"background: linear-gradient(transparent 64%, rgba(31, 137, 150, 0.28) 64%);\">start earning a UK Doctor salary<\u002Fspan>, and create stability beyond your monthly payslip ...<i>without losing your money, visa, or not securing your ILR.<\u002Fi><\u002Fh1>\n      <p style=\"font-size:18px;color:#43545a;margin:20px 0 0;max-width:44ch\">This is the step-by-step map <u>from your home country to your first NHS payslip<\u002Fu>, with the visas, the exams, the GMC, and the money, even if you have not booked a single exam yet.<\u002Fp>\n      <div id=\"mw-hero-cta\" style=\"margin-top:30px;display:flex;flex-direction:column;gap:10px;align-items:flex-start\">\n        <a href=\"#mw-offer\" sc-camel-on-click=\"{{ goOffer }}\" style=\"display:inline-flex;gap:10px;position:relative;overflow:hidden;align-items:center;justify-content:center;background:#1f8996;color:#ffffff;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:18px;border-radius:10px;padding:18px 32px;text-decoration:none;box-shadow:0 8px 20px rgba(31,137,150,.22)\" style-hover=\"opacity:.92;transform:translateY(-1px)\"><span style=\"position:relative;z-index:1;white-space:nowrap\">Get the Visa and Relocation Guide<\u002Fspan><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:relative;z-index:1;flex:none\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span aria-hidden=\"true\" style=\"position:absolute;top:-20%;bottom:-20%;left:-40%;width:28%;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);transform:skewX(-20deg);animation:mwGlare 3.2s cubic-bezier(.4,0,.2,1) infinite;pointer-events:none\"><\u002Fspan><\u002Fa>\n        <span style=\"font-size:14px;color:#43545a\">Written for IMG doctors, by an IMG doctor who made the move.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"mw-hero-img\" style=\"min-width:0;position:relative\">\n      <div style=\"position:relative;width:100%;aspect-ratio:4/5;max-height:640px\">\n        <div style=\"position:absolute;inset:0;border-radius:14px;overflow:hidden\"><img src=\"897f45b7-9184-4c6d-9504-6500cc3d9053\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3 PROOF STRIP -->\n<div style=\"border-bottom:1px solid #dde8ea;background:#ffffff\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))\">\n    <div style=\"padding:24px 20px;display:flex;gap:14px;align-items:center;justify-content:center\"><span style=\"width:42px;height:42px;border-radius:10px;background:#e8f6f9;color:#1f8996;display:flex;align-items:center;justify-content:center;flex:none\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12l19-8-6 18-3-8z\"><\u002Fpath><path d=\"M12 14l9-10\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:15.5px;line-height:1.35\">Built by a doctor who made the move from Nigeria to the NHS.<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:24px 20px;display:flex;gap:14px;align-items:center;justify-content:center\"><span style=\"width:42px;height:42px;border-radius:10px;background:#e8f6f9;color:#1f8996;display:flex;align-items:center;justify-content:center;flex:none\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"10\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.9\"><\u002Fpath><path d=\"M16 3.1a4 4 0 0 1 0 7.8\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:15.5px;line-height:1.35\">Trusted by over 10,000 UK doctors.<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:24px 20px;display:flex;gap:14px;align-items:center;justify-content:center\"><span style=\"width:42px;height:42px;border-radius:10px;background:#e8f6f9;color:#1f8996;display:flex;align-items:center;justify-content:center;flex:none\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\u002Fpath><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"><\u002Fpath><path d=\"M9 7h7\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:15.5px;line-height:1.35\">From the author of the Amazon bestseller, The Moneywise Doctor.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 4 PROBLEM -->\n<section style=\"padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,5vw,72px);align-items:center\">\n    <div style=\"min-width:0\">\n      <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#0f2a30;font-size:clamp(28px,3.4vw,40px);margin:0\">Does this sound like your current situation?<\u002Fh2>\n      <p style=\"margin:22px 0 0\">When you moved to the UK as an IMG, you had no clue about the financial system.<br><br>The UK credit system, mortgages, tax laws, ISAs, and NHS pensions all seems complicated and overwhelming for you.<br><br><b><u>And trying to understand it felt like attempting to decode a complex puzzle.<br><\u002Fu><\u002Fb><br>It was not only tough and time-consuming, but it can be downright expensive.<\u002Fp>\n      <p style=\"margin: 16px 0 0; font-family: 'Manrope', system-ui, sans-serif; font-weight: 600; color: #0f2a30; font-size: 20px; line-height: 1.35; margin-top: 25px\">And because of this you currently feel overwhelmed by the whole process it takes to figure it out by yourself<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;width:100%;aspect-ratio:4/5;max-height:600px;min-width:0\"><div style=\"position:absolute;inset:0;border-radius:14px;overflow:hidden\"><img src=\"data:image/webp;base64,UklGRn7KAQBXRUJQVlA4WAoAAAAgAAAAvwMArwQASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADT tify-content:center;flex:none\">1<\u002Fspan><div><div style=\"color:#0f2a30;font-weight:600\">If you book the exams in the wrong order.<\u002Fdiv><div style=\"color:#b3563f;margin-top:4px;font-size:16px\">You may get months added to your timeline, <u>and every month on a visa is money that you slowly loose without any assurance of getting it back.<\u002Fu><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:20px 22px\"><span style=\"width:32px;height:32px;border-radius:50%;background:#0f2a30;color:#fff;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fspan><div><div style=\"color:#0f2a30;font-weight:600\">Or you choose a visa route because a friend used it, and not because it fit your case.<\u002Fdiv><div style=\"color:#b3563f;margin-top:4px;font-size:16px\">Which means <i><u>you paid extra fees you did not need to pay<\u002Fu><\u002Fi>, and wasted more time that you can't get back.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:20px 22px\"><span style=\"width:32px;height:32px;border-radius:50%;background:#0f2a30;color:#fff;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fspan><div><div style=\"color:#0f2a30;font-weight:600\">Your GMC registration slows down because one document was missing.<\u002Fdiv><div style=\"color:#b3563f;margin-top:4px;font-size:16px\">Which means the job start date gets farther, and <u>the savings you came with keep draining while you wait.<\u002Fu><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:20px 22px\"><span style=\"width:32px;height:32px;border-radius:50%;background:#0f2a30;color:#fff;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none\">4<\u002Fspan><div><div style=\"color:#0f2a30;font-weight:600\">You take the first NHS post that says yes.<\u002Fdiv><div style=\"color:#b3563f;margin-top:4px;font-size:16px\">Which means 5 years of your career gets shaped by a rushed decision you made because you did not know you had better options.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:20px 22px\"><span style=\"width:32px;height:32px;border-radius:50%;background:#0f2a30;color:#fff;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none\">5<\u002Fspan><div><div style=\"color:#0f2a30;font-weight:600\">You go to open a bank account or rent a flat, and the banks treats you as a risk, because no one told you to start a credit history the week you land.<\u002Fdiv><div style=\"color:#b3563f;margin-top:4px;font-size:16px\">Which means you get turned down, for things you really need to have.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6 THE TURN -->\n<section style=\"padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px\">\n    <p style=\"margin:0;text-align:center;font-size:18px;color:#6b7c82\">If any of those explained your situation, I know exactly how you feel...<\u002Fp>\n    <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#0f2a30;font-size:clamp(28px,3.4vw,40px);margin:16px auto 0;max-width:800px;text-align:center\">Because the mistakes that cost IMG doctors the most do not come from a lack of money, they come from a lack of information.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:40px\">\n      <div style=\"border:1px solid #dde8ea;border-radius:14px;padding:28px 26px;background:#ffffff;display:flex;gap:16px;align-items:flex-start\">\n        <span style=\"width:36px;height:36px;border-radius:50%;background:#f4f9fa;color:#b3563f;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px\">✕<\u002Fspan>\n        <p style=\"margin:0;font-size:18px;color:#0f2a30;line-height:1.5\">There is the slow, expensive way; which happen when you try to figure it out yourself. <br><br>You pay for every lesson with real money and you also loose time.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #1f8996;border-radius:14px;padding:28px 26px;background:#ffffff;box-shadow:0 1px 2px rgba(15,42,48,.04),0 14px 34px rgba(15,42,48,.07);display:flex;gap:16px;align-items:flex-start\">\n        <span style=\"width:36px;height:36px;border-radius:50%;background:#e8f6f9;color:#1f8996;display:flex;align-items:center;justify-content:center;flex:none;font-size:16px\">✓<\u002Fspan>\n        <p style=\"margin:0;font-size:18px;color:#0f2a30;line-height:1.5\">And there is the other way. <br><br><b>You follow one guide, in the right order, f<u>rom a Doctor who has already walked the road you're currently on<\u002Fu> and paid for every wrong turn so you do not have to.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:32px 0 0;text-align:center;font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:20px\">That is the whole idea behind this guide.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 7 INTRODUCE THE SOLUTION -->\n<section style=\"padding:0 0 clamp(72px,10vw,128px)\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px\">\n    <div style=\"background:#0f2a30;border-radius:14px;padding:clamp(32px,4vw,52px) clamp(24px,4vw,48px)\">\n      <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.15;color:#ffffff;font-size:clamp(26px,3.2vw,38px);margin:0;max-width:20ch\">It is called the Visa and Relocation Guide.<\u002Fh2>\n      <p style=\"color:#b9cfd4;max-width:62ch;margin:18px 0 0;font-size:18px\">It shows you one clear path, from where you are now to your first NHS payslip. <br><br>Every step in the order that saves you the most time and the most money without you having to learn the lessons the hard way.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:40px;row-gap:28px\">\n        <div style=\"border-top:2px dashed rgba(255,255,255,.22);padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#7fd0d8\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">01<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;font-size:17px;margin-top:4px\">Exams<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top:2px dashed rgba(255,255,255,.22);padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#7fd0d8\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">02<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;font-size:17px;margin-top:4px\">GMC<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top:2px dashed rgba(255,255,255,.22);padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#7fd0d8\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">03<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;font-size:17px;margin-top:4px\">Visa<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top:2px dashed rgba(255,255,255,.22);padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#7fd0d8\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">04<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;font-size:17px;margin-top:4px\">First post<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top:2px dashed rgba(255,255,255,.22);padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#7fd0d8\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">05<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;font-size:17px;margin-top:4px\">UK money<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top:2px solid #7fd0d8;padding-top:22px;position:relative\"><span style=\"position:absolute;top:-9px;left:0;width:16px;height:16px;border-radius:50%;background:#ffffff;box-shadow:0 0 0 5px rgba(255,255,255,.15)\"><\u002Fspan><div style=\"font-size:12px;font-weight:700;color:#7fd0d8;letter-spacing:.06em\">06<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#ffffff;font-size:17px;margin-top:4px\">First payslip<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8 WHAT IS INSIDE -->\n<section style=\"background:#f4f9fa;padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(28px,4vw,56px); er:1px solid #dde8ea;border-radius:14px;padding:26px 24px\"><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#1f8996;font-size:15px;letter-spacing:.04em\">03<\u002Fdiv><h3 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:20px;margin:12px 0 8px;letter-spacing:-0.02em;line-height:1.2\">The Money Runway.<\u002Fh3><p style=\"margin:0;font-size:15.5px\">What to save, what to spend, and what to stop spending before your first payslip clears and this helps reduce the gap between landing and getting paid, <span style=\"color: rgb(15, 42, 48); font-weight: 600;\">which means you sleep well at night in your first hard months.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:26px 24px\"><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#1f8996;font-size:15px;letter-spacing:.04em\">04<\u002Fdiv><h3 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:20px;margin:12px 0 8px;letter-spacing:-0.02em;line-height:1.2\">How to land the right first post.<\u002Fh3><p style=\"margin:0;font-size:15.5px\">Where the good NHS jobs are and how an IMG wins one, so your first job sets up the next five years, <span style=\"color: rgb(15, 42, 48); font-weight: 600;\">which means the move pays you back for decades, not just once.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:26px 24px\"><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#1f8996;font-size:15px;letter-spacing:.04em\">05<\u002Fdiv><h3 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:20px;margin:12px 0 8px;letter-spacing:-0.02em;line-height:1.2\">How to setup your UK Bank Accounts<\u002Fh3><p style=\"margin:0;font-size:15.5px\">The right bank accounts to open, the credit history to start, the electoral roll, all in 1 week, so that the system stops seeing you as a risk, <span style=\"color: rgb(15, 42, 48); font-weight: 600;\">which means the you get a positive response on the mortgage, device and rent when you need it.<\u002Fspan><\u002Fp><\u002Fdiv>\n      <div style=\"background:#ffffff;border:1px solid #dde8ea;border-radius:14px;padding:26px 24px\"><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#1f8996;font-size:15px;letter-spacing:.04em\">06<\u002Fdiv><h3 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:20px;margin:12px 0 8px;letter-spacing:-0.02em;line-height:1.2\">The costly mistakes to avoid as an IMG.<\u002Fh3><p style=\"margin:0;font-size:15.5px\">The pension misstep, the mortgage rejection, the 60% tax trap waiting for you at £100,000, so you see them coming, <span style=\"color: rgb(15, 42, 48); font-weight: 600;\">which means you keep money most IMG doctors quietly lose.<\u002Fspan><\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9 FOUNDER STORY -->\n<section style=\"padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n    <div style=\"position:relative;width:100%;aspect-ratio:4/5;min-width:0\">\n      <div style=\"position:absolute;inset:0;border-radius:14px;overflow:hidden\"><img src=\"data:image/webp;base64,UklGRpKsAABXRUJQVlA4WAoAAAAgAAAAHwMAEwIASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkF licked for me. <br><br>It was never that I earned too little, or was not capable,<br><br><b>I JUST DIDN'T HAVE A GUIDE!<br><\u002Fb><br>Every mistake came from not knowing, and not knowing was costing me real money.<\u002Fp>\n      <p style=\"margin:14px 0 0\">So I wrote the guide down. <br><br>Every step, in the order I wish I had done it. <br><br>The guide you are looking at is the thing I needed on the day I landed.<\u002Fp>\n      <p style=\"margin:14px 0 0;color:#0f2a30;font-weight:600\">I paid for these lessons the hard way. You do not have to.<\u002Fp>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 THE OFFER -->\n<section id=\"mw-offer\" style=\"background:#f4f9fa;padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 24px\">\n    <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#0f2a30;font-size:clamp(28px,3.4vw,40px);margin:0;text-align:center\">Here is everything you get today.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(28px,4vw,56px);align-items:center;margin-top:44px\">\n      <div style=\"position:relative;min-height:480px;min-width:0\">\n        <div style=\"position:absolute;left:2%;top:0;width:42%;aspect-ratio:3/4;background:#ffffff;border:1px solid #dde8ea;border-radius:14px;box-shadow:0 1px 2px rgba(15,42,48,.04),0 14px 34px rgba(15,42,48,.07);transform:rotate(-7deg);padding:22px\"><div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6b7c82\">Bonus<\u002Fdiv><div style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:17px;margin-top:6px;line-height:1.2\">The IMG Relocation Checklist<\u002Fdiv><div style=\"margin-top:16px;display:grid;gap:9px\"><div style=\"height:8px;width:90%;background:#e8f6f9;border-radius:4px\"><\u002Fdiv><div style=\"height:8px;width:75%;backgroun th:0\">\n        <h3 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;color:#0f2a30;font-size:22px;margin:0 0 10px;letter-spacing:-0.02em\">The Clearer-Path Promise<\u002Fh3>\n        <p style=\"margin:0;font-size:16.5px\">Open the guide and if it does not give you a clearer, cheaper path to the UK than you had before, email us within 60 days and we will refund every penny. You have nothing to lose and everything to gain. The risk is on us.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 14 URGENCY -->\n<section style=\"background:#0f2a30;padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:800px;margin:0 auto;padding:0 24px;text-align:center\">\n    <p style=\"margin:0;font-size:18px;color:#7fd0d8\">Here is the part most people get wrong...<\u002Fp>\n    <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#ffffff;font-size:clamp(28px,3.4vw,40px);margin:14px 0 0\">Every time you wait, is another missed opportunity..<\u002Fh2>\n    <p style=\"font-size:18px;color:#b9cfd4;margin:20px 0 0\">Every month you put this off, another fee you did not need. Another step in the wrong direction. Another month your savings drain while you wait on a document you could have had ready.<\u002Fp>\n    <p style=\"font-size:20px;font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#ffffff;margin:20px 0 0;line-height:1.35\">The move is coming either way. The only question is whether you walk in with a guide, or pay to learn it one expensive mistake at a time.<\u002Fp>\n    <div class=\"mw-cta-wrap\" style=\"display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:34px\">\n      <a href=\"#mw-offer\" sc-camel-on-click=\"{{ goOffer }}\" style=\"display:inline-flex;gap:10px;position:relative;overflow:hidden;align-items:center;justify-content:center;background:#7fd0d8;color:#0f2a30;font-family:'Manrope', system-ui, sans-serif;font-weight:700;font-size:18px;border-radius:10px;padding:18px 32px;text-decoration:none\" style-hover=\"opacity:.9\"><span style=\"position:relative;z-index:1;white-space:nowrap\">Get the Visa and Relocation Guide<\u002Fspan><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:relative;z-index:1;flex:none\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><span aria-hidden=\"true\" style=\"position:absolute;top:-20%;bottom:-20%;left:-40%;width:28%;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);transform:skewX(-20deg);animation:mwGlare 3.2s cubic-bezier(.4,0,.2,1) infinite;pointer-events:none\"><\u002Fspan><\u002Fa>\n      <span style=\"font-size:14px;color:#b9cfd4\">Start tonight. Keep it for life.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 15 FAQ -->\n<section style=\"padding:clamp(72px,10vw,128px) 0\">\n  <div style=\"max-width:820px;margin:0 auto;padding:0 24px\">\n    <h2 style=\"font-family:'Manrope', system-ui, sans-serif;font-weight:700;letter-spacing:-0.02em;line-height:1.1;color:#0f2a30;font-size:clamp(28px,3.4vw,40px);margin:0 0 36px;text-align:center\">Frequently Asked Questions<\u002Fh2>\n    <div style=\"border-top:1px solid #dde8ea\">\n      <div style=\"border-bottom:1px solid #dde8ea\"><button sc-camel-on-click=\"{{ t1 }}\" style=\"width:100%;background:none;border:0;text-align:left;font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:18px;padding:20px 0;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center\"><span>I have not sat PLAB yet. Is it too early?<\u002Fspan><span style=\"color:#1f8996;font-size:24px;font-weight:400;line-height:1\">{{ s1 }}<\u002Fspan><\u002Fbutton><sc-if value=\"{{ o1 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 0 20px;font-size:16.5px\">No. Earlier is better. The whole point is to get the order and the money right before you spend on the wrong step.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dde8ea\"><button sc-camel-on-click=\"{{ t2 }}\" style=\"width:100%;background:none;border:0;text-align:left;font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:18px;padding:20px 0;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center\"><span>Does this get me a visa or a job?<\u002Fspan><span style=\"color:#1f8996;font-size:24px;font-weight:400;line-height:1\">{{ s2 }}<\u002Fspan><\u002Fbutton><sc-if value=\"{{ o2 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 0 20px;font-size:16.5px\">No. It shows you the exact path to both, in the right order, so you stop wasting time and money. The adviser call, if you add it, checks your route with a regulated person.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dde8ea\"><button sc-camel-on-click=\"{{ t3 }}\" style=\"width:100%;background:none;border:0;text-align:left;font-family:'Manrope', system-ui, sans-serif;font-weight:600;color:#0f2a30;font-size:18px;padding:20px 0;cursor:pointer;display:flex;justify-content:space-between;gap:16px;align-items:center\"><span>How is this different from the free stuff online?<\u002Fspan><span style=\"color:#1f8996;font-size:24px;font-weight:400;line-height:1\">{{ s3 }}<\u002Fspan><\u002Fbutton><sc-if value=\"{{ o3 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 0 20px;font-size:16.5px\">Free content is scattered, generic, and often written by people who never made the move. This is one map, in order, from a doctor who did it. And it ties the move to the money, which is where IMGs lose the most.<\u002Fp><\u002Fsc-if><\u002Fdiv>\n      <div style=\"border-bottom:1px solid #dde8ea\"><button sc-camel-on-click=\"{{ t4 }}\" sty
